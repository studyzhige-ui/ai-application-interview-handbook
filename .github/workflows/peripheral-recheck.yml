name: Peripheral recheck workbench
on:
  push:
    branches: [docs/peripheral-recheck-20260928]
    paths: [.github/workflows/peripheral-recheck.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/peripheral-recheck-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Agent verification dependencies
        run: python -m pip install -r tools/agent-validation-requirements.txt
      - name: Apply reviewed patch, validate, and publish exact tree
        shell: python
        run: |
          import hashlib, json, os, pathlib, runpy, subprocess, sys
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'peripheral-recheck-publication'
          out.mkdir(exist_ok=True)
          base='83e5f314d43dd4d73335a2c5268f0103710178d5'
          branch='docs/peripheral-recheck-20260928'
          temporary='.github/workflows/peripheral-recheck.yml'
          expected={
              'guide/navigation-index.md':'d60928958be1d16f1519252e6ce296b9ec1223f805754aeb6e61a4074d17c51e',
              'tools/sync_outer_navigation.py':'0bcd5f68c90cd406864e2fc656971b1588d06c2fb6f40027ef62c2dcbf22de4e',
              'tools/test_outer_navigation.py':'96fa599cebeba6c02a7daffc3c3262fc336a7f5b67166711211563e3e3c97300',
          }
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert os.environ['GITHUB_REF_NAME']==branch
          start=git('rev-parse','HEAD')
          assert start==os.environ['GITHUB_SHA']
          assert git('rev-parse','origin/main')==base, 'main advanced; re-review required'
          assert git('diff','--name-only',base,'HEAD')==temporary
          source=root/'tools/sync_outer_navigation.py'
          old='个实际资料目录，技术事实与真人面经证据分开。'
          new='个资料入口（含集中资料目录与模块内参考页），技术事实与真人面经证据分开。'
          text=source.read_text(encoding='utf-8')
          assert text.count(old)==1
          source.write_text(text.replace(old,new),encoding='utf-8')
          tests=root/'tools/test_outer_navigation.py'
          test='''    def test_reference_summary_counts_entries_not_directories(self):
                  self.put('curriculum/10-system-design/references.md','# System Design｜References\\n')
                  data=outer.inventory(self.root)
                  self.assertEqual(len(data['references']),3)
                  self.assertEqual(data['curriculum_chapters'],10)
                  changes=outer.plan(self.root,data)
                  index=changes[outer.INDEX]
                  self.assertIn('3 个资料入口（含集中资料目录与模块内参考页）',index)
                  self.assertNotIn('3 个实际资料目录',index)
                  self.apply(changes)
                  self.assertEqual(outer.plan(self.root,outer.inventory(self.root)),{})
          '''
          anchor='    def test_module_local_reference_links_are_validated(self):\n'
          text=tests.read_text(encoding='utf-8')
          assert text.count(anchor)==1 and 'test_reference_summary_counts_entries_not_directories' not in text
          tests.write_text(text.replace(anchor,test+anchor),encoding='utf-8')
          subprocess.run(['git','rm','--',temporary],check=True)
          checks=[]
          def check(args):
              result=subprocess.run(args,text=True,capture_output=True)
              checks.append({'command':args,'returncode':result.returncode,'stdout':result.stdout,'stderr':result.stderr})
              (out/'checks.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf-8')
              print(' '.join(args)); print(result.stdout); print(result.stderr)
              result.check_returncode()
          check([sys.executable,'tools/sync_outer_navigation.py','--apply'])
          check([sys.executable,'-m','unittest','discover','-s','tools','-p','test_outer_navigation.py','-v'])
          ns=runpy.run_path('tools/test_learning_navigation.py')
          names=[name for name in ns if name.startswith('test_')]
          for name in names: ns[name]()
          assert len(names)==6
          check([sys.executable,'tools/sync_agent_materials.py','--check'])
          check([sys.executable,'tools/validate_agent_readability.py','--run-examples'])
          check([sys.executable,'tools/test_agent_course.py'])
          check([sys.executable,'curriculum/10-system-design/review/mechanism_lab.py','all'])
          check([sys.executable,'-m','unittest','discover','-s','curriculum/10-system-design/review','-p','test_mechanism_lab.py','-v'])
          check([sys.executable,'-m','compileall','-q','tools'])
          for name in ['dynamic_official_jobs','xiaomi_2027','bytedance_2027','feishu_official_2027','moka_official_2027']:
              check(['node','--check','tools/fetch_'+name+'.mjs'])
          for name in ['validate_official_2027_source_contracts','validate_repository_semantics','apply_canonical_audit','build_gap_candidates','build_market_analysis','validate_source_coverage']:
              check([sys.executable,'tools/'+name+'.py'])
          check([sys.executable,'tools/sync_outer_navigation.py','--check'])
          for path,sha in expected.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==sha, 'Hash mismatch: '+path
          subprocess.run(['git','add','--',*expected],check=True)
          assert set(git('diff','--cached','--name-only',base).splitlines())==set(expected)
          assert not git('diff','--name-only'), 'Unexpected unstaged writes'
          assert git('write-tree')=='c3a6249fe22fa5a1e6fc23bb547bababfb7f1908', 'Entire tree differs from local review'
          check(['git','diff','--cached','--check'])
          subprocess.run(['git','fetch','origin','main',branch],check=True)
          assert git('rev-parse','origin/main')==base
          assert git('rev-parse','origin/'+branch)==start
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','docs: correct reference-entry count after module-local source discovery'],check=True)
          head=git('rev-parse','HEAD')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          result={'baseline':base,'head':head,'tree':git('rev-parse','HEAD^{tree}'),'expected_sha256':expected,'learning_order_tests':len(names),'checks_passed':True}
          (out/'publication.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peripheral-recheck-publication
          path: ${{ runner.temp }}/peripheral-recheck-publication/
          retention-days: 7
