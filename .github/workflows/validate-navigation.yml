name: Validate learning navigation
on:
  push:
    branches: [main]
    paths: ['**/*.md', 'guide/**/*.json', 'tools/*.py', '.github/workflows/validate-navigation.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.md', 'guide/**/*.json', 'tools/*.py', '.github/workflows/validate-navigation.yml']
permissions:
  contents: read
concurrency:
  group: learning-navigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python on public runner
        if: github.event.repository.private == false
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test peripheral synchronization
        run: python -m unittest discover -s tools -p test_outer_navigation.py -v
      - name: Check current entry pages and local links
        run: python tools/sync_outer_navigation.py --check
      - name: Check original learning-order transforms
        shell: python
        run: |
          import runpy
          tests=runpy.run_path('tools/test_learning_navigation.py')
          names=[name for name in tests if name.startswith('test_')]
          for name in names: tests[name]()
          print(f'{len(names)} learning-order regression checks passed')
