name: dedupe-date-round-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-date-round-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fix stale post-dedupe narrative references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('research')
          for p in root.rglob('*.md'):
              text=p.read_text(encoding='utf-8')
              text=text.replace('`S380`','`S280`')
              text=text.replace('最终 Batch 26 的 6 条中，4 条来自 3～4 月','去重后的 Batch 26 共 5 条，其中 3 条来自 3～4 月')
              text=text.replace('最终 Batch 26 的 6 条中，4 条来自 3～4 月，','去重后的 Batch 26 共 5 条，其中 3 条来自 3～4 月，')
              p.write_text(text,encoding='utf-8')
          corpus='\n'.join(p.read_text(encoding='utf-8') for p in root.rglob('*.md'))
          assert '`S380`' not in corpus
          assert '最终 Batch 26 的 6 条' not in corpus
          assert '正式 HUMAN-A 来源：**279 个**' in (root/'README.md').read_text(encoding='utf-8')
          assert '来源编号：`S001–S279`' in (root/'README.md').read_text(encoding='utf-8')
          assert '下一条保留编号：**`S280`**' in (root/'README.md').read_text(encoding='utf-8')
          Path('.github/workflows/dedupe-date-round-once.yml').unlink()
          print('CONSISTENCY_OK S380=0 final=279 next=S280 batch26=5')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'research: finalize dedupe consistency'
          git push origin HEAD:main
