name: dedupe-date-round-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-date-round-once.yml'

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Keep semantic URL validation scoped to source entries
        shell: bash
        run: sed -i '/assert "328260668ec94ebda5c84de205d13a58" not in all_batches/d' .github/scripts/final_dedupe.py
      - name: Validate staged script syntax
        run: python -m py_compile .github/scripts/final_dedupe.py
      - name: Dedupe all HUMAN-A sources and renumber globally
        run: python .github/scripts/final_dedupe.py
      - name: Commit final deduplicated library
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'research: dedupe 379 sources and renumber globally'
          git push origin HEAD:main
