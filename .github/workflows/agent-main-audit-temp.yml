name: Temporary main Agent teaching audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-main-audit-temp.yml', 'tools/_agent_main_apply.py']
permissions:
  contents: read
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: agent-main-staged-payload
          path: tools/_agent_main_bundle/
          retention-days: 1
