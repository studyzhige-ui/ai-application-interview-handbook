name: Temporary main Agent teaching audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-main-audit-temp.yml', 'tools/_agent_main_apply.py']
permissions:
  contents: write
concurrency:
  group: agent-main-reader-revision
  cancel-in-progress: false
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply checksum-verified documents and execute limited teaching tests
        run: python -B tools/_agent_main_apply.py
      - name: Commit only verified changes to requested main branch
        run: |
          test "$GITHUB_REF_NAME" = main
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(agent): rebuild all 23 main chapters for beginner comprehension and source-grounded training'
          git push origin HEAD:main
