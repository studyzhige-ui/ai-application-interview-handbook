name: Final Agent reader rendering checks
on:
  push:
    branches: [work/agent-clarity-20260928]
    paths: ['_agent_final_polish.py', '.github/workflows/agent-final-polish.yml']
permissions:
  contents: write
concurrency:
  group: agent-reader-final-polish-20260928
  cancel-in-progress: false
jobs:
  polish:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: ${{ !github.event.repository.private }}
        with:
          python-version: '3.12'
      - name: Prepare isolated checks
        shell: pwsh
        run: |
          git config --local core.quotePath false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPYCACHEPREFIX = Join-Path $env:RUNNER_TEMP 'agent-final-bytecode'
          "PYTHONPYCACHEPREFIX=$env:PYTHONPYCACHEPREFIX" >> $env:GITHUB_ENV
          $venv = Join-Path $env:RUNNER_TEMP 'agent-final-checks'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = if ($IsWindows) { Join-Path $venv 'Scripts/python.exe' } else { Join-Path $venv 'bin/python' }
          & $py -m pip install --disable-pip-version-check -r tools/agent-validation-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENT_VALIDATION_PYTHON=$py" >> $env:GITHUB_ENV
      - name: Correct, verify and commit only the isolated branch
        shell: pwsh
        run: |
          & $env:AGENT_VALIDATION_PYTHON _agent_final_polish.py
          exit $LASTEXITCODE
      - name: Preserve credential-free reviewed files
        if: always()
        shell: pwsh
        run: |
          python -c "import os,pathlib,subprocess,zipfile; root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'agent-final-tree.zip'; names=subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split(chr(0)); z=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED); [(z.write(root/n,n)) for n in sorted(set(names)) if n and (root/n).is_file() and not n.startswith('.git/')]; z.close(); print(out)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-final-tree
          path: ${{ runner.temp }}/agent-final-tree.zip
          retention-days: 3
          if-no-files-found: error
