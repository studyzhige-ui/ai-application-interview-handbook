name: Agent curriculum refactor (temporary)
on:
  push:
    branches: [docs/agent-architecture-map-20260916-0266cbf]
    paths: [tools/_agent_refactor.py, .github/workflows/_agent_refactor.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rebuild and validate the single Agent curriculum
        run: |
          python3 tools/_agent_refactor.py
          python3 tools/validate_agent_curriculum.py
          git diff --check
      - name: Commit the verified migration to this review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: rebuild Agent curriculum around task contract and four layers'
          git push origin HEAD:docs/agent-architecture-map-20260916-0266cbf
