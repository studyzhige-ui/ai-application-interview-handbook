name: Cleanup stale Actions runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale-actions.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - name: Cancel stale active workflow runs
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $activeStatuses = @("queued", "in_progress", "pending", "waiting")
          $cancelled = @()

          foreach ($status in $activeStatuses) {
            $uri = "https://api.github.com/repos/$env:REPOSITORY/actions/runs?status=$status&per_page=100"
            try {
              $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            } catch {
              Write-Warning "Could not list status=$status : $($_.Exception.Message)"
              continue
            }

            foreach ($run in $response.workflow_runs) {
              if ("$($run.id)" -eq "$env:CURRENT_RUN_ID") {
                continue
              }

              $cancelUri = "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/cancel"
              try {
                Invoke-RestMethod -Uri $cancelUri -Headers $headers -Method Post | Out-Null
                $cancelled += "$($run.id) $($run.name) [$status]"
                Write-Host "Cancel requested: $($run.id) $($run.name) [$status]"
              } catch {
                $code = $_.Exception.Response.StatusCode.value__
                if ($code -eq 409) {
                  Write-Host "Already completed / not cancellable: $($run.id)"
                } else {
                  Write-Warning "Cancel failed for $($run.id): $($_.Exception.Message)"
                }
              }
            }
          }

          Write-Host "Cancellation requests sent: $($cancelled.Count)"
