name: Rebuild market analysis

on:
  push:
    branches:
      - main
    paths:
      - 'interview/canonical/**'
      - 'market/interviews/**'
      - 'tools/build_market_analysis.py'
      - 'tools/build_gap_candidates.py'
      - 'tools/apply_canonical_audit.py'
      - 'tools/sync_expected_canonical_count.py'
      - 'tools/validate_source_coverage.py'
      - 'tools/phase2b_canonical_audit.json'
      - '.github/workflows/rebuild-market-analysis.yml'

permissions:
  contents: write

jobs:
  build-windows:
    name: Rebuild (private / Windows self-hosted)
    if: github.event.repository.private == true && github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check local Windows toolchain
        shell: powershell
        run: |
          python -c "import sys; print(sys.version); assert sys.version_info >= (3, 12)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply reviewed canonical coverage audit
        run: python tools/apply_canonical_audit.py

      - name: Sync expected canonical count from reviewed audit
        run: python tools/sync_expected_canonical_count.py

      - name: Build raw gap candidates
        run: python tools/build_gap_candidates.py

      - name: Build frozen Canonical analysis
        run: python tools/build_market_analysis.py

      - name: Validate reviewed source coverage
        run: python tools/validate_source_coverage.py

      - name: Commit canonical and generated analysis
        shell: powershell
        run: |
          $changes = git status --porcelain interview/canonical market/analysis tools/build_market_analysis.py
          if (-not $changes) {
            Write-Host 'No generated changes.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interview/canonical market/analysis tools/build_market_analysis.py
          git commit -m 'market: rebuild frozen canonical analysis'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-linux:
    name: Rebuild (public / Linux GitHub-hosted)
    if: github.event.repository.private == false && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed canonical coverage audit
        run: python tools/apply_canonical_audit.py

      - name: Sync expected canonical count from reviewed audit
        run: python tools/sync_expected_canonical_count.py

      - name: Build raw gap candidates
        run: python tools/build_gap_candidates.py

      - name: Build frozen Canonical analysis
        run: python tools/build_market_analysis.py

      - name: Validate reviewed source coverage
        run: python tools/validate_source_coverage.py

      - name: Commit canonical and generated analysis
        shell: bash
        run: |
          if [ -z "$(git status --porcelain interview/canonical market/analysis tools/build_market_analysis.py)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interview/canonical market/analysis tools/build_market_analysis.py
          git commit -m 'market: rebuild frozen canonical analysis'
          git push origin HEAD:${{ github.ref_name }}
