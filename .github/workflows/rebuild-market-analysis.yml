name: Rebuild market analysis

on:
  push:
    branches:
      - canonicalize-questions
    paths:
      - 'research/questions/**'
      - 'research/interviews/**'
      - 'tools/build_market_analysis.py'
      - '.github/workflows/rebuild-market-analysis.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate Phase 2B analysis
        run: python tools/build_market_analysis.py

      - name: Commit generated analysis
        shell: bash
        run: |
          if [ -z "$(git status --porcelain research/analysis)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/analysis
          git commit -m 'research: rebuild phase 2B market analysis'
          git push origin HEAD:${{ github.ref_name }}
