name: dedupe-components-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-components-once.yml'

permissions:
  contents: write

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedupe-379-audit
          fetch-depth: 1
      - name: Build exact-overlap component report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('research/dedupe-audit.json').read_text(encoding='utf-8'))
          byid={e['id']:e for e in d['entries']}
          parent={i:i for i in byid}
          def find(x):
              while parent[x]!=x:
                  parent[x]=parent[parent[x]];x=parent[x]
              return x
          def union(a,b):
              ra,rb=find(a),find(b)
              if ra!=rb:parent[rb]=ra
          for g in d['exact_url_groups']:
              ids=sorted(set(g['ids']))
              for i in ids[1:]:union(ids[0],i)
          comps={}
          for i in byid:comps.setdefault(find(i),[]).append(i)
          comps=[sorted(v) for v in comps.values() if len(v)>1]
          comps.sort(key=lambda v:v[0])
          url_to_ids={}
          for g in d['exact_url_groups']:url_to_ids[g['url']]=g['ids']
          out=['# Exact URL connected components','',f'Components: {len(comps)}',f'Duplicate member count removed if one canonical/component: {sum(len(c)-1 for c in comps)}','']
          for c in comps:
              can=min(c)
              ranked=[]
              for i in c:
                  e=byid[i]
                  ranked.append((len(set(e.get('norm_urls',[]))),len(e.get('qtext','')),i))
              ranked.sort(reverse=True)
              richest=ranked[0][2]
              allurls=[]
              for i in c:
                  for u in byid[i].get('norm_urls',[]):
                      if u not in allurls:allurls.append(u)
              out += [f"## canonical S{can:03d} | members {', '.join('S%03d'%i for i in c)} | richest S{richest:03d}",f'- all distinct source URLs: {len(allurls)}']
              for i in c:
                  e=byid[i]
                  new_vs_can=[u for u in e.get('norm_urls',[]) if u not in byid[can].get('norm_urls',[])]
                  out += [f"- S{i:03d}: urls={len(set(e.get('norm_urls',[])))} qchars={len(e.get('qtext',''))} title={e['title']}",f"  urls: {e.get('source_urls',[])}",f"  URLs beyond earliest canonical: {new_vs_can}"]
              out += ['']
          Path('research/dedupe-components.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out[:500]))
          PY
      - name: Commit report to temporary branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dedupe-components.md
          git commit -m 'chore: generate exact duplicate component report' || exit 0
          git push origin HEAD:dedupe-379-audit
