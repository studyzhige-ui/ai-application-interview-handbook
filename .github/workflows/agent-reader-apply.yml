name: Apply and validate Agent reader refinement
on:
  push:
    branches: [work/agent-clarity-20260928]
    paths:
      - '_agent_refine/**'
      - '.github/workflows/agent-reader-apply.yml'
      - 'tools/test_agent_course.py'
      - 'tools/validate_agent_readability.py'
      - 'tools/sync_agent_materials.py'
permissions:
  contents: write
concurrency:
  group: agent-reader-refinement-20260928
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: ${{ !github.event.repository.private }}
        with:
          python-version: '3.12'
      - name: Prepare isolated validation environment
        shell: pwsh
        run: |
          $env:PYTHONPYCACHEPREFIX = Join-Path $env:RUNNER_TEMP 'agent-bytecode-20260928'
          "PYTHONPYCACHEPREFIX=$env:PYTHONPYCACHEPREFIX" >> $env:GITHUB_ENV
          $venv = Join-Path $env:RUNNER_TEMP 'agent-reader-validation-20260928'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = if ($IsWindows) { Join-Path $venv 'Scripts/python.exe' } else { Join-Path $venv 'bin/python' }
          & $py -m pip install --disable-pip-version-check -r tools/agent-validation-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENT_VALIDATION_PYTHON=$py" >> $env:GITHUB_ENV
      - name: Apply exact drafts, validate and commit only the work branch
        shell: pwsh
        run: |
          & $env:AGENT_VALIDATION_PYTHON _agent_refine/launch.py
          exit $LASTEXITCODE
      - name: Preserve tracked review snapshot without Git credentials
        if: always()
        shell: pwsh
        run: |
          python -c "import os,pathlib,subprocess,zipfile; root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'agent-reviewed-tree.zip'; names=subprocess.check_output(['git','ls-files','--cached','--others','--exclude-standard','-z']).decode('utf-8').split(chr(0)); z=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED); [(z.write(root/n,n)) for n in sorted(set(names)) if n and (root/n).is_file() and not n.startswith('.git/')]; z.close(); print(out)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-reviewed-tree
          path: ${{ runner.temp }}/agent-reviewed-tree.zip
          if-no-files-found: warn
          retention-days: 3
