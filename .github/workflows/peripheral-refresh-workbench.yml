name: Validate and publish peripheral refresh
on:
  push:
    branches: [docs/peripheral-agent-system-sync-20260928]
    paths: [.github/workflows/peripheral-refresh-workbench.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/peripheral-agent-system-sync-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install module validation dependencies
        run: python -m pip install -r tools/agent-validation-requirements.txt
      - name: Apply checksum-verified patch and reproduce all checks
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, platform, runpy, subprocess, sys, zlib
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'peripheral-refresh-publication'; out.mkdir()
          base='6b49c76a9c1229177d34acb9b6d85bfdd626a4e9'
          expected_tree='1058d14fdd2f516b27b2734e5d8f1c8288558a39'
          branch='docs/peripheral-agent-system-sync-20260928'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert os.environ['GITHUB_REF_NAME']==branch
          assert git('rev-parse','origin/main')==base, 'main advanced; re-audit required'
          start=git('rev-parse','HEAD'); assert start==os.environ['GITHUB_SHA']
          temporary=['.github/peripheral-refresh-1.b64','.github/peripheral-refresh-2.b64','.github/workflows/peripheral-refresh-workbench.yml']
          assert set(git('diff','--name-only',base,'HEAD').splitlines())==set(temporary)
          encoded=''.join((root/p).read_text().strip() for p in temporary[:2])
          (out/'received-patch.b64').write_text(encoded)
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a22d14e5126fead278a6057557b925d5d44e911c3625d69ec76380fcb23ce5f8'
          patch_path=out/'reviewed.patch'; patch_path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(patch_path)],check=True)
          subprocess.run(['git','apply','--index',str(patch_path)],check=True)
          subprocess.run(['git','rm','--',*temporary],check=True)
          assert git('write-tree')==expected_tree, 'applied tree differs from reviewed local tree'
          changed=git('diff','--cached','--name-only',base).splitlines()
          assert len(changed)==19
          checks=[]
          def check(args):
              result=subprocess.run(args,text=True,capture_output=True)
              print(result.stdout); print(result.stderr)
              checks.append({'command':args,'exit_code':result.returncode,'stdout':result.stdout,'stderr':result.stderr})
              (out/'checks.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf-8')
              result.check_returncode()
              return result
          result=check([sys.executable,'-m','unittest','discover','-s','tools','-p','test_outer_navigation.py','-v'])
          assert 'Ran 27 tests' in result.stderr
          ns=runpy.run_path('tools/test_learning_navigation.py'); names=[n for n in ns if n.startswith('test_')]
          for name in names: ns[name]()
          assert len(names)==6
          check([sys.executable,'tools/sync_agent_materials.py','--check'])
          result=check([sys.executable,'tools/test_agent_course.py']); assert 'Ran 36 tests' in result.stderr
          check([sys.executable,'tools/validate_agent_readability.py','--run-examples'])
          result=check([sys.executable,'-m','unittest','discover','-s','curriculum/10-system-design/review','-p','test_mechanism_lab.py','-v'])
          assert 'Ran 51 tests' in result.stderr
          check([sys.executable,'curriculum/10-system-design/review/mechanism_lab.py','all'])
          check([sys.executable,'-m','compileall','-q','tools'])
          for name in ['dynamic_official_jobs','xiaomi_2027','bytedance_2027','feishu_official_2027','moka_official_2027']:
              check(['node','--check','tools/fetch_'+name+'.mjs'])
          for name in ['validate_official_2027_source_contracts','validate_repository_semantics','apply_canonical_audit','build_gap_candidates','build_market_analysis','validate_source_coverage']:
              check([sys.executable,'tools/'+name+'.py'])
          first=check([sys.executable,'tools/sync_outer_navigation.py','--check'])
          navigation=json.loads(first.stdout)
          assert navigation['markdown_pages_scanned']==432 and navigation['local_links_checked']==4529
          assert not any(navigation[k] for k in ['changed_files','missing_paths','unresolved_anchors','conflict_markers'])
          check([sys.executable,'tools/sync_outer_navigation.py','--apply'])
          check([sys.executable,'tools/sync_outer_navigation.py','--check'])
          assert not git('diff','--name-only'), 'validation changed tracked files'
          assert not git('diff','--cached','--name-only',base,'--','curriculum/09-agent','curriculum/10-system-design','products','practice','market','interview')
          assert git('write-tree')==expected_tree
          check(['git','diff','--cached','--check'])
          subprocess.run(['git','fetch','origin','main',branch],check=True)
          assert git('rev-parse','origin/main')==base, 'main advanced during validation'
          assert git('rev-parse','origin/'+branch)==start, 'working branch advanced during validation'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','docs: align peripheral guidance with updated Agent and System Design modules'],check=True)
          head=git('rev-parse','HEAD'); assert git('rev-parse','HEAD^{tree}')==expected_tree
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          report={'base':base,'head':head,'tree':expected_tree,'changed_files':changed,'python':platform.python_version(),'file_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in changed},'tests':{'outer_navigation':27,'learning_order':6,'agent':36,'system_design':51},'navigation':navigation,'all_checks_passed':True,'module_bodies_and_frozen_evidence_unchanged':True}
          (out/'publication.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peripheral-refresh-publication
          path: ${{ runner.temp }}/peripheral-refresh-publication/
          retention-days: 7
