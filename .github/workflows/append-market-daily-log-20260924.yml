name: Append Market Daily Log 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/append-market-daily-log-20260924.yml

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append final log safely and self-delete
        shell: bash
        env:
          APPEND_B64: ""
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! grep -Fq 'Current formal Market library：**35 Batch / 297 HUMAN-A / `S001–S297`**' market/monitoring/daily-log.md; then
              printf '%s' "$APPEND_B64" | base64 -d >> market/monitoring/daily-log.md
            fi
            rm -f .github/workflows/append-market-daily-log-20260924.yml
            git add market/monitoring/daily-log.md .github/workflows/append-market-daily-log-20260924.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "market: append 2026-09-24 evening monitoring log"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Failed to append daily log after concurrent updates" >&2
          exit 1
