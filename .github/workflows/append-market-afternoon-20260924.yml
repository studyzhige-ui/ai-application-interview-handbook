name: Append market afternoon log once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-market-afternoon-20260924.yml'

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append afternoon monitoring log and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

