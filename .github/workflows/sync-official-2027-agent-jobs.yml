name: Sync official current-campus Agent jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'market/job-description/03-strategy/**'
      - 'market/job-description/01-data/official-company-role-index.json'
      - 'market/job-description/01-data/official-first-party-role-seeds.json'
      - 'market/job-description/04-scripts/**'
      - '.github/workflows/sync-official-2027-agent-jobs.yml'
  schedule:
    - cron: '0 1 * * 2,5'

permissions:
  contents: write

concurrency:
  group: official-current-campus-agent-sync-v2
  cancel-in-progress: true

jobs:
  sync-windows:
    name: Sync jobs (private / Windows self-hosted)
    if: github.event.repository.private == true
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      SYNC_SOURCE_SHA: ${{ github.sha }}
      BROWSER_COMPANY_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check local Windows toolchain
        shell: powershell
        run: |
          python -c "import sys; print(sys.version); assert sys.version_info >= (3, 12)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const major=Number(process.versions.node.split('.')[0]); console.log(process.version); if(major < 22) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline business contracts and regressions
        run: python market/job-description/04-scripts/jd.py check

      - name: Install collection dependencies
        run: |
          python -m pip install --disable-pip-version-check -r market/job-description/04-scripts/requirements.txt
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Collect, preserve full evidence, normalize, and audit
        run: python market/job-description/04-scripts/jd.py collect --live

      - name: Print coverage audit
        if: always()
        shell: powershell
        run: Get-Content market/job-description/02-analysis/official-2027-coverage-audit.generated.md -Encoding utf8

      - name: Commit generated output with stale-input and race protection
        if: success() && github.ref == 'refs/heads/main'
        run: python market/job-description/04-scripts/jd.py publish

  sync-linux:
    name: Sync jobs (public / Linux GitHub-hosted)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SYNC_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline business contracts and regressions
        run: python market/job-description/04-scripts/jd.py check

      - name: Install collection dependencies
        run: |
          python -m pip install --disable-pip-version-check -r market/job-description/04-scripts/requirements.txt
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Collect, preserve full evidence, normalize, and audit
        run: python market/job-description/04-scripts/jd.py collect --live

      - name: Print coverage audit
        if: always()
        run: cat market/job-description/02-analysis/official-2027-coverage-audit.generated.md

      - name: Commit generated output with stale-input and race protection
        if: success() && github.ref == 'refs/heads/main'
        run: python market/job-description/04-scripts/jd.py publish
