name: Sync official 2027 Agent campus jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 2,5'
  push:
    branches: [main]
    paths:
      - 'tools/sync_official_2027_agent_jobs.py'
      - 'market/jobs/official-2027-campus-sources.json'
      - '.github/workflows/sync-official-2027-agent-jobs.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Pull official recruitment APIs
        run: python tools/sync_official_2027_agent_jobs.py

      - name: Commit discovery output
        run: |
          if [ -z "$(git status --porcelain market/jobs/official-2027-agent-jobs.generated.md market/jobs/official-2027-agent-jobs.generated.json)" ]; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/jobs/official-2027-agent-jobs.generated.md market/jobs/official-2027-agent-jobs.generated.json
          git commit -m 'market: sync official 2027 Agent campus discovery'
          git push origin HEAD:${{ github.ref_name }}
