name: Sync official current-campus Agent jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'market/jobs/official-2027-campus-sources.json'
      - 'market/jobs/official-company-role-index.json'
      - 'market/jobs/official-first-party-role-seeds.json'
      - 'tools/fetch_dynamic_official_jobs.mjs'
      - 'tools/fetch_feishu_official_2027.mjs'
      - 'tools/fetch_moka_official_2027.mjs'
      - 'tools/fetch_xiaomi_2027.mjs'
      - 'tools/fetch_bytedance_2027.mjs'
      - 'tools/sync_official_2027_agent_jobs.py'
      - 'tools/audit_official_2027_job_sources.py'
      - 'tools/validate_official_2027_source_contracts.py'
      - '.github/workflows/sync-official-2027-agent-jobs.yml'
  schedule:
    - cron: '0 1 * * 2,5'

permissions:
  contents: write

concurrency:
  group: official-current-campus-agent-sync-v2
  cancel-in-progress: true

jobs:
  sync-windows:
    name: Sync jobs (private / Windows self-hosted)
    if: github.event.repository.private == true
    runs-on: [self-hosted, Windows]
    env:
      PYTHONUTF8: "1"
      SYNC_SOURCE_SHA: ${{ github.sha }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check local Windows toolchain
        shell: powershell
        run: |
          python -c "import sys; print(sys.version); assert sys.version_info >= (3, 12)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const major=Number(process.versions.node.split('.')[0]); console.log(process.version); if(major < 22) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Check dynamic job fetcher
        run: node --check tools/fetch_dynamic_official_jobs.mjs

      - name: Check official ATS Node adapters
        run: |
          node --check tools/fetch_xiaomi_2027.mjs
          node --check tools/fetch_bytedance_2027.mjs
          node --check tools/fetch_feishu_official_2027.mjs
          node --check tools/fetch_moka_official_2027.mjs

      - name: Validate persistent official source and role contracts
        run: python tools/validate_official_2027_source_contracts.py

      - name: Exhaust fixed official current-campus job-list pages
        run: node tools/fetch_dynamic_official_jobs.mjs market/jobs/official-2027-browser-discovery.generated.json

      - name: Pull Xiaomi official campus ATSX accelerator
        continue-on-error: true
        run: node tools/fetch_xiaomi_2027.mjs

      - name: Pull ByteDance official campus ATSX accelerator
        continue-on-error: true
        run: node tools/fetch_bytedance_2027.mjs

      - name: Pull verified official Feishu ATS accelerators
        continue-on-error: true
        run: node tools/fetch_feishu_official_2027.mjs market/jobs/official-2027-feishu-discovery.generated.json

      - name: Pull verified official Moka ATS accelerators
        continue-on-error: true
        run: node tools/fetch_moka_official_2027.mjs market/jobs/official-2027-moka-discovery.generated.json

      - name: Normalize and filter official current-campus jobs
        run: python tools/sync_official_2027_agent_jobs.py

      - name: Audit every registered company
        run: python tools/audit_official_2027_job_sources.py

      - name: Print coverage audit
        shell: powershell
        run: Get-Content market/jobs/official-2027-coverage-audit.generated.md -Encoding utf8

      - name: Commit generated output safely
        shell: powershell
        run: |
          $stashDir = Join-Path $env:RUNNER_TEMP 'job-sync'
          if (Test-Path $stashDir) { Remove-Item -Recurse -Force $stashDir }
          New-Item -ItemType Directory -Path $stashDir | Out-Null

          Get-ChildItem 'market/jobs/official-2027-*.generated.*' | Copy-Item -Destination $stashDir
          Copy-Item 'market/jobs/official-company-role-index.json' -Destination $stashDir
          Copy-Item 'market/jobs/official-company-role-index.md' -Destination $stashDir
          Copy-Item 'market/jobs/company-scan-pool.md' -Destination $stashDir

          $sourceSha = '${{ github.sha }}'
          $inputPaths = @(
            'market/jobs/official-2027-campus-sources.json',
            'market/jobs/official-company-role-index.json',
            'market/jobs/official-first-party-role-seeds.json',
            'tools/fetch_dynamic_official_jobs.mjs',
            'tools/fetch_feishu_official_2027.mjs',
            'tools/fetch_moka_official_2027.mjs',
            'tools/fetch_xiaomi_2027.mjs',
            'tools/fetch_bytedance_2027.mjs',
            'tools/sync_official_2027_agent_jobs.py',
            'tools/audit_official_2027_job_sources.py',
            'tools/validate_official_2027_source_contracts.py',
            '.github/workflows/sync-official-2027-agent-jobs.yml'
          )
          function Test-RelevantInputChange([string]$baseSha, [string]$headSha) {
            $changed = git diff --name-only "$baseSha..$headSha" -- $inputPaths
            return [bool]$changed
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteSha = (git rev-parse origin/main).Trim()
          if (($remoteSha -ne $sourceSha) -and (Test-RelevantInputChange $sourceSha $remoteSha)) {
            Write-Host "sync inputs changed from $sourceSha to $remoteSha; discard stale discovery output."
            exit 0
          }
          if ($remoteSha -ne $sourceSha) {
            Write-Host "main advanced only on unrelated paths; publish against $remoteSha."
          }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem (Join-Path $stashDir '*') | Copy-Item -Destination 'market/jobs' -Force

          $changes = git status --porcelain -- 'market/jobs/official-2027-*.generated.*' 'market/jobs/official-company-role-index.json' 'market/jobs/official-company-role-index.md' 'market/jobs/company-scan-pool.md'
          if (-not $changes) {
            Write-Host 'No discovery changes.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'market/jobs/official-2027-*.generated.*' 'market/jobs/official-company-role-index.json' 'market/jobs/official-company-role-index.md' 'market/jobs/company-scan-pool.md'
          git commit -m 'market: sync official current-campus Agent discovery [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $latestRemoteSha = (git rev-parse origin/main).Trim()
            $parentSha = (git rev-parse HEAD^).Trim()
            if ($latestRemoteSha -ne $parentSha) {
              if (Test-RelevantInputChange $sourceSha $latestRemoteSha) {
                Write-Host "sync inputs changed during publication; discard stale discovery commit."
                exit 0
              }
              Write-Host "main advanced only on unrelated paths; rebasing generated commit onto $latestRemoteSha."
              git rebase origin/main
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "push raced with another commit; retrying publication ($attempt/3)."
          }
          exit 1

  sync-linux:
    name: Sync jobs (public / Linux GitHub-hosted)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SYNC_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Check dynamic job fetcher
        run: node --check tools/fetch_dynamic_official_jobs.mjs

      - name: Check official ATS Node adapters
        run: |
          node --check tools/fetch_xiaomi_2027.mjs
          node --check tools/fetch_bytedance_2027.mjs
          node --check tools/fetch_feishu_official_2027.mjs
          node --check tools/fetch_moka_official_2027.mjs

      - name: Validate persistent official source and role contracts
        run: python tools/validate_official_2027_source_contracts.py

      - name: Exhaust fixed official current-campus job-list pages
        run: node tools/fetch_dynamic_official_jobs.mjs market/jobs/official-2027-browser-discovery.generated.json

      - name: Pull Xiaomi official campus ATSX accelerator
        continue-on-error: true
        run: node tools/fetch_xiaomi_2027.mjs

      - name: Pull ByteDance official campus ATSX accelerator
        continue-on-error: true
        run: node tools/fetch_bytedance_2027.mjs

      - name: Pull verified official Feishu ATS accelerators
        continue-on-error: true
        run: node tools/fetch_feishu_official_2027.mjs market/jobs/official-2027-feishu-discovery.generated.json

      - name: Pull verified official Moka ATS accelerators
        continue-on-error: true
        run: node tools/fetch_moka_official_2027.mjs market/jobs/official-2027-moka-discovery.generated.json

      - name: Normalize and filter official current-campus jobs
        run: python tools/sync_official_2027_agent_jobs.py

      - name: Audit every registered company
        run: |
          python tools/audit_official_2027_job_sources.py
          cat market/jobs/official-2027-coverage-audit.generated.md

      - name: Commit generated output safely
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/job-sync"
          rm -f "${{ runner.temp }}/job-sync/"*
          for f in market/jobs/official-2027-*.generated.* market/jobs/official-company-role-index.json market/jobs/official-company-role-index.md market/jobs/company-scan-pool.md; do
            cp "$f" "${{ runner.temp }}/job-sync/$(basename "$f")"
          done

          source_sha="${{ github.sha }}"
          input_paths=(
            market/jobs/official-2027-campus-sources.json
            market/jobs/official-company-role-index.json
            market/jobs/official-first-party-role-seeds.json
            tools/fetch_dynamic_official_jobs.mjs
            tools/fetch_feishu_official_2027.mjs
            tools/fetch_moka_official_2027.mjs
            tools/fetch_xiaomi_2027.mjs
            tools/fetch_bytedance_2027.mjs
            tools/sync_official_2027_agent_jobs.py
            tools/audit_official_2027_job_sources.py
            tools/validate_official_2027_source_contracts.py
            .github/workflows/sync-official-2027-agent-jobs.yml
          )
          relevant_inputs_changed() {
            [ -n "$(git diff --name-only "$1..$2" -- "${input_paths[@]}")" ]
          }

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$source_sha" ] && relevant_inputs_changed "$source_sha" "$remote_sha"; then
            echo "sync inputs changed from $source_sha to $remote_sha; discard stale discovery output."
            exit 0
          fi
          if [ "$remote_sha" != "$source_sha" ]; then
            echo "main advanced only on unrelated paths; publish against $remote_sha."
          fi
          git reset --hard origin/main

          for f in "${{ runner.temp }}/job-sync/"*; do
            cp "$f" "market/jobs/$(basename "$f")"
          done

          if [ -z "$(git status --porcelain -- market/jobs/official-2027-*.generated.* market/jobs/official-company-role-index.json market/jobs/official-company-role-index.md market/jobs/company-scan-pool.md)" ]; then
            echo "No discovery changes."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/jobs/official-2027-*.generated.* market/jobs/official-company-role-index.json market/jobs/official-company-role-index.md market/jobs/company-scan-pool.md
          git commit -m 'market: sync official current-campus Agent discovery [skip ci]'

          for attempt in 1 2 3; do
            git fetch origin main
            latest_remote_sha="$(git rev-parse origin/main)"
            parent_sha="$(git rev-parse HEAD^)"
            if [ "$latest_remote_sha" != "$parent_sha" ]; then
              if relevant_inputs_changed "$source_sha" "$latest_remote_sha"; then
                echo "sync inputs changed during publication; discard stale discovery commit."
                exit 0
              fi
              echo "main advanced only on unrelated paths; rebasing generated commit onto $latest_remote_sha."
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit; retrying publication ($attempt/3)."
          done
          exit 1
