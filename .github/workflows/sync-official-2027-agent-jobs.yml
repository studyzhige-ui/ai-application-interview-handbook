name: Check stored official JD sources (collection disabled)

# No schedule/push trigger and no live collection/publication step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-check:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Windows"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.event.repository.private == false
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: github.event.repository.private == false
        with:
          node-version: '22'
      - name: Check existing Windows toolchain
        if: github.event.repository.private == true
        shell: powershell
        run: |
          python -c "import sys; assert sys.version_info >= (3, 12)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read-only snapshot and offline fixture checks
        run: python -B market/job-description/04-scripts/jd.py check
