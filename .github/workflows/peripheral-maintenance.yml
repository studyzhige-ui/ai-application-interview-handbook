name: Publish verified peripheral synchronization
on:
  push:
    branches: [docs/peripheral-sync-20260928]
    paths: [.github/workflows/peripheral-maintenance.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/peripheral-sync-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce the reviewed patch and validate before committing
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, runpy, subprocess, sys, zlib
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'peripheral-publication'
          out.mkdir(exist_ok=True)
          base='a1a86db75f4d9714b95dca25ce9b1b0563bdd72e'
          branch='docs/peripheral-sync-20260928'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert os.environ['GITHUB_REF_NAME']==branch
          assert git('rev-parse','origin/main')==base, 'main moved: re-audit required'
          start=git('rev-parse','HEAD')
          assert start==os.environ['GITHUB_SHA'], 'working branch moved'
          temp=['.github/peripheral-payload-1.txt','.github/peripheral-payload-2.txt','.github/workflows/peripheral-maintenance.yml']
          assert set(git('diff','--name-only',base,'HEAD').splitlines())==set(temp)
          encoded=''.join((root/p).read_text().strip() for p in temp[:2])
          (out/'received-payload.b64').write_text(encoded)
          encoded=encoded.replace('E7u6qehc','E7u6ehc')
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='2abe8a4431729b5b6fe9b912dd5a1e2e29047d5d83202506b0e37977be729ccc', 'publication package checksum mismatch'
          payload=json.loads(raw)
          for i,script in enumerate(payload['scripts']):
              code=script.replace('/mnt/data/handbook',str(root))
              exec(compile(code,f'maintenance-stage-{i}.py','exec'),{'__name__':'__main__'})
          p=root/'tools/test_outer_navigation.py'
          p.write_text(p.read_text().replace('class ExpandedScopeTests(FullFixtureTests):\n    """Additional regressions run on an independent complete miniature repository."""\n',''))
          for p,text in payload['files'].items(): (root/p).write_text(text)
          subprocess.run(['git','rm','--',*temp],check=True)
          subprocess.run(['git','add','--',*payload['expected']],check=True)
          subprocess.run([sys.executable,'tools/sync_outer_navigation.py','--apply'],check=True)
          checks=[]
          def check(args):
              result=subprocess.run(args,text=True,capture_output=True)
              print(result.stdout); print(result.stderr)
              checks.append({'command':args,'returncode':result.returncode,'stdout':result.stdout,'stderr':result.stderr})
              (out/'checks.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2))
              result.check_returncode()
          check([sys.executable,'-m','unittest','discover','-s','tools','-p','test_outer_navigation.py','-v'])
          ns=runpy.run_path('tools/test_learning_navigation.py')
          names=[n for n in ns if n.startswith('test_')]
          for name in names: ns[name]()
          assert len(names)==6
          check([sys.executable,'-m','compileall','-q','tools'])
          for name in ['dynamic_official_jobs','xiaomi_2027','bytedance_2027','feishu_official_2027','moka_official_2027']:
              check(['node','--check','tools/fetch_'+name+'.mjs'])
          for script in ['validate_official_2027_source_contracts','validate_agent_readability','validate_repository_semantics','apply_canonical_audit','build_gap_candidates','build_market_analysis','validate_source_coverage']:
              check([sys.executable,'tools/'+script+'.py'])
          check([sys.executable,'tools/sync_outer_navigation.py','--check'])
          mismatches=[p for p,h in payload['expected'].items() if hashlib.sha256((root/p).read_bytes()).hexdigest()!=h]
          assert not mismatches,mismatches
          subprocess.run(['git','add','--',*payload['expected']],check=True)
          changed=set(git('diff','--cached','--name-only',base).splitlines())
          assert changed==set(payload['expected']), sorted(changed.symmetric_difference(payload['expected']))
          assert not git('diff','--name-only'), 'unstaged changes'
          check(['git','diff','--cached','--check'])
          old='cbea9e31333a63fd7ba04016cb591dfddfd64855'
          successor='dedffc9e9ef9ebd8ed26eb9657d9b09471e29161'
          proof=subprocess.run(['git','diff','--exit-code',old,successor,'--','products/agent/claude-code','guide/project/claude-code-reader-revision.md'],text=True,capture_output=True)
          (out/'claude-supersession.txt').write_text(proof.stdout+proof.stderr)
          subprocess.run(['git','fetch','origin','main',branch],check=True)
          assert git('rev-parse','origin/main')==base, 'main moved during validation'
          assert git('rev-parse','origin/'+branch)==start, 'branch moved during validation'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','docs: synchronize peripheral documentation with the complete current curriculum'],check=True)
          head=git('rev-parse','HEAD')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          publication={'base':base,'head':head,'tree':git('rev-parse','HEAD^{tree}'),'changed_files':len(changed),'expected_sha256':payload['expected'],'learning_order_tests':len(names),'claude_superseded_files_identical':proof.returncode==0,'checks_passed':True}
          (out/'publication.json').write_text(json.dumps(publication,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(publication,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peripheral-publication
          path: ${{ runner.temp }}/peripheral-publication/
          retention-days: 7
