name: One-shot append market daily log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-market-daily-log-once.yml'

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append log and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s' '' | base64 -d >> market/monitoring/daily-log.md
          git rm .github/workflows/append-market-daily-log-once.yml
          git add market/monitoring/daily-log.md
          git commit -m "market: backfill and finalize 2026-09-23 daily log"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
