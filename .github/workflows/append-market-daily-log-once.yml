name: One-shot append market daily log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-market-daily-log-once.yml'

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Append missing monitoring log and remove one-shot workflow
