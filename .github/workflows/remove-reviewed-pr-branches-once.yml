name: Remove already reviewed PR branches (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-reviewed-pr-branches-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove closed and unchanged reviewed PR heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          expected = {
              "automation/jd-v2-feishu-dedupe-query-20261012": {"sha": "c3f62f23e86c2b72bffe0a766c3a54f4445c6fb2", "pr": 63, "merged": True},
              "automation/jd-v3-final-concurrency-20261012": {"sha": "30c228a73304ab6e6df59e3dc7366d853638b9e1", "pr": 66, "merged": False},
              "market/interview-audit-2026-10-12": {"sha": "eddd965891b41f3ce982d33bf1cd9347056f6eba", "pr": 68, "merged": True},
              "market/interview-audit-2026-10-13": {"sha": "a510ee49cc7bf8aae7e15571615c29708692c38a", "pr": 71, "merged": True},
              "market/interview-audit-2026-10-14": {"sha": "a842efd6aa90fafd695ad5d407471e22cc5b8aca", "pr": 73, "merged": True},
              "market/interview-audit-2026-10-15": {"sha": "6b565abbb3d60f82bb79047f4fe0ae13f047f089", "pr": 79, "merged": True},
          }
          root = f"https://api.github.com/repos/{os.environ['GH_REPO']}"
          token = os.environ["GH_TOKEN"]

          def api(route, method="GET"):
              req = Request(root + route, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          deleted, skipped = [], []
          for branch, expectation in expected.items():
              pr = api(f"/pulls/{expectation['pr']}")
              if pr["state"] != "closed" or bool(pr.get("merged")) != expectation["merged"]:
                  skipped.append((branch, "PR not in expected reviewed state"))
                  continue
              if pr["head"]["ref"] != branch or pr["head"]["sha"] != expectation["sha"]:
                  skipped.append((branch, "PR head changed"))
                  continue
              route = f"/git/ref/heads/{quote(branch, safe='/')}"
              try:
                  actual = api(route)
              except HTTPError as error:
                  if error.code == 404:
                      skipped.append((branch, "already absent"))
                      continue
                  raise
              if actual["object"]["sha"] != expectation["sha"]:
                  skipped.append((branch, "branch changed since review"))
                  continue
              api(f"/git/refs/heads/{quote(branch, safe='/')}", method="DELETE")
              deleted.append(branch)
              print("DELETED", branch)
          print("Removed", len(deleted), "skipped", len(skipped))
          for branch, reason in skipped:
              print("SKIPPED", branch, reason)
