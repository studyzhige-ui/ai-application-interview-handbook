name: Temporary main Agent teaching review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-main-review-temp.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: fc948f8c473e5d11e780ffcf1fd7f812a2020932
          persist-credentials: false
      - name: Export pinned public code without executing it
        run: git archive --format=tar.gz -o /tmp/codex-pinned-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: codex-pinned-source
          path: /tmp/codex-pinned-source.tar.gz
          retention-days: 1
