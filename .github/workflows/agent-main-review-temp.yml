name: Temporary main Agent teaching review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-main-review-temp.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export current main and staged text without git credentials
        run: git archive --format=tar.gz -o /tmp/handbook-review.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: handbook-review
          path: /tmp/handbook-review.tar.gz
          retention-days: 1
