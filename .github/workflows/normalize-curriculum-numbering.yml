name: Normalize curriculum numbering

on:
  push:
    branches:
      - canonicalize-questions
    paths:
      - tools/normalize_curriculum_numbering.py
      - .github/workflows/normalize-curriculum-numbering.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonicalize-questions
          fetch-depth: 0
      - name: Normalize numbering and references
        run: python tools/normalize_curriculum_numbering.py
      - name: Commit normalized docs
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vector-db llm-foundation rag roadmap research README.md
          git commit -m "docs: normalize curriculum numbering and references"
          git push origin HEAD:canonicalize-questions
