name: Final v1 quality audit

on:
  push:
    branches:
      - canonicalize-questions
    paths:
      - tools/final_v1_quality_audit.py
      - .github/workflows/final-v1-quality-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonicalize-questions
      - name: Run mechanical final audit
        run: python tools/final_v1_quality_audit.py
