name: Check dynamic official jobs script

on:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_dynamic_official_jobs.mjs'
      - '.github/workflows/check-dynamic-job-script.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/fetch_dynamic_official_jobs.mjs
