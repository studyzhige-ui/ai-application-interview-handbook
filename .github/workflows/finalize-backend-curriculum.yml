name: Finalize AI Backend curriculum

on:
  push:
    branches:
      - canonicalize-questions
    paths:
      - tools/finalize_backend_curriculum.py
      - .github/workflows/finalize-backend-curriculum.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonicalize-questions
          fetch-depth: 0
      - name: Validate AI Backend and synchronize repository status
        run: python tools/finalize_backend_curriculum.py
      - name: Commit synchronized status
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md roadmap research
          git commit -m "docs(backend): finalize coverage, depth and Phase 3 status"
          git push origin HEAD:canonicalize-questions
