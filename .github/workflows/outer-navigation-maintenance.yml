name: Outer navigation maintenance
on:
  push:
    branches: [docs/outer-navigation-sync-20260927]
    paths: [.github/workflows/outer-navigation-maintenance.yml, tools/sync_outer_navigation.py, tools/test_outer_navigation.py]
permissions:
  contents: write
concurrency:
  group: outer-navigation-maintenance
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/outer-navigation-sync-20260927
          fetch-depth: 0
      - name: Complete deterministic parser guards
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/sync_outer_navigation.py')
          s=p.read_text(encoding='utf-8')
          old="    if value.scheme or value.netloc: return None\n    base=root if value.path.startswith('/') else page.parent"
          new="    if value.scheme or value.netloc: return None\n    if not value.path: return page.resolve(),unquote(value.fragment)\n    base=root if value.path.startswith('/') else page.parent"
          if old in s: s=s.replace(old,new)
          s=s.replace("records.sort(key=lambda p:(re.findall(r'20\\d{2}-\\d{2}-\\d{2}',p.name) or ['0000'])[0],reverse=True)","records.sort(key=lambda p:((re.findall(r'20\\d{2}-\\d{2}-\\d{2}',p.name) or ['0000'])[0],p.as_posix()),reverse=True)")
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Test peripheral synchronizer
        run: python -m unittest discover -s tools -p test_outer_navigation.py -v
      - name: Synchronize current peripheral pages
        run: python tools/sync_outer_navigation.py --apply --report guide/project/outer-navigation-sync-2026-09-27.json
      - name: Verify repeatability and original navigation tests
        shell: python
        run: |
          import runpy, subprocess
          subprocess.run(['python','tools/sync_outer_navigation.py','--check'],check=True)
          tests=runpy.run_path('tools/test_learning_navigation.py')
          names=[n for n in tests if n.startswith('test_')]
          for name in names: tests[name]()
          print(f'{len(names)} existing navigation checks passed')
      - name: Validate handbook links and semantics
        run: |
          python tools/validate_agent_readability.py
          python tools/validate_repository_semantics.py
      - name: Preserve LLM numerical validation
        run: python -m unittest discover -s curriculum/07-llm-foundation/labs -p 'test_*.py' -v
      - name: Publish only approved peripheral changes
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          report=Path('guide/project/outer-navigation-sync-2026-09-27.json')
          data=json.loads(report.read_text())
          paths=data['changed_files']+[report.as_posix(),'tools/sync_outer_navigation.py']
          for p in paths:
              if '/docs/' in p or p.startswith(('market/','interview/canonical/')): raise SystemExit('Protected path: '+p)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','docs(navigation): synchronize current peripheral indexes'],check=True)
              subprocess.run(['git','push','origin','HEAD:docs/outer-navigation-sync-20260927'],check=True)
          print(json.dumps(data,ensure_ascii=False,indent=2))
