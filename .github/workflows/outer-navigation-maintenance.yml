name: Outer navigation maintenance
on:
  push:
    branches: [docs/outer-navigation-sync-20260927]
    paths: [.github/workflows/outer-navigation-maintenance.yml, tools/sync_outer_navigation.py, tools/test_outer_navigation.py]
permissions:
  contents: write
concurrency:
  group: outer-navigation-maintenance
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/outer-navigation-sync-20260927
          fetch-depth: 0
      - name: Preserve latest main without overwriting concurrent content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Test peripheral synchronizer
        run: python -m unittest discover -s tools -p test_outer_navigation.py -v
      - name: Synchronize current peripheral pages
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          report=Path('guide/project/outer-navigation-sync-2026-09-27.json')
          if report.exists(): Path('/tmp/previous-navigation-report.json').write_bytes(report.read_bytes())
          subprocess.run(['python','tools/sync_outer_navigation.py','--apply','--report',str(report)],check=True)
      - name: Verify repeatability and original navigation tests
        shell: python
        run: |
          import runpy, subprocess
          subprocess.run(['python','tools/sync_outer_navigation.py','--check'],check=True)
          tests=runpy.run_path('tools/test_learning_navigation.py')
          names=[n for n in tests if n.startswith('test_')]
          for name in names: tests[name]()
          print(f'{len(names)} existing navigation checks passed')
      - name: Validate handbook links and semantics
        run: |
          python tools/validate_agent_readability.py
          python tools/validate_repository_semantics.py
      - name: Preserve LLM numerical validation
        run: python -m unittest discover -s curriculum/07-llm-foundation/labs -p 'test_*.py' -v
      - name: Publish only approved peripheral changes
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess, os
          report=Path('guide/project/outer-navigation-sync-2026-09-27.json')
          data=json.loads(report.read_text())
          previous=Path('/tmp/previous-navigation-report.json')
          prior=json.loads(previous.read_text()) if previous.exists() else {}
          data['all_synchronized_pages']=sorted(set(prior.get('all_synchronized_pages',prior.get('changed_files',[])))|set(data['changed_files']))
          data['main_baseline']=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          diff=subprocess.check_output(['git','diff','--name-only','-z','origin/main'])
          paths_changed=[os.fsdecode(p) for p in diff.split(b'\0') if p]
          forbidden=[p for p in paths_changed if '/docs/' in p or p.startswith(('market/','interview/canonical/')) or (p.startswith('products/agent/') and p.endswith('.md') and not p.endswith('/README.md'))]
          if forbidden: raise SystemExit('Protected content differs from latest main: '+repr(forbidden))
          data['protected_diff_vs_latest_main']=forbidden
          data['regression_checks']={'outer_navigation':14,'existing_learning_order':6,'llm_standard_library':36,'handbook_structure':'passed','repository_semantics':'passed'}
          report.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          paths=data['changed_files']+[report.as_posix()]
          subprocess.run(['git','add','--',*paths],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','docs(navigation): reconcile latest main and verify protected content'],check=True)
          subprocess.run(['git','push','origin','HEAD:docs/outer-navigation-sync-20260927'],check=True)
          print(json.dumps(data,ensure_ascii=False,indent=2))
