name: One-shot append 2026-09-24 morning market log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-market-daily-log-20260924-morning.yml'

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append log and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          if ! grep -q '^## 2026-09-24$' market/monitoring/daily-log.md; then
            printf '%s' '' | base64 -d >> market/monitoring/daily-log.md
          fi
          git rm -f .github/workflows/append-market-daily-log-20260924-morning.yml
          git add market/monitoring/daily-log.md
          git commit -m "market: log 2026-09-24 morning monitoring"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
