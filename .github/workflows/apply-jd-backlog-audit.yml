name: Apply historical JD backlog audit

on:
  push:
    branches:
      - automation/jd-backlog-bulk-audit-20261014
    paths:
      - ".github/workflows/apply-jd-backlog-audit.yml"

permissions:
  contents: write

concurrency:
  group: apply-jd-backlog-audit
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bulk-audit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all audit shards
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("market/job-description/01-data/automation")
          queue_raw = (root / "review-queue.json").read_bytes()
          queue_blob_sha = hashlib.sha1(
              f"blob {len(queue_raw)}\0".encode() + queue_raw
          ).hexdigest()

          total_entries = 0
          total_decisions = 0
          all_input_ids = set()
          all_decision_ids = set()
          counts = {"include": 0, "exclude": 0, "needs_review": 0, "remove": 0}
          expected_source_sha = None

          for shard_id in [f"{i:02d}" for i in range(1, 9)]:
              shard = json.loads((root / "backlog-audit" / f"shard-{shard_id}.json").read_text())
              payload = json.loads((root / "backlog-audit" / f"decisions-{shard_id}.json").read_text())
              assert payload["schema_version"] == 1
              assert payload["shard_id"] == shard_id
              assert payload["source_queue_sha"] == shard["source_queue_sha"]
              assert len(payload["decisions"]) == len(shard["entries"])

              if expected_source_sha is None:
                  expected_source_sha = shard["source_queue_sha"]
              assert shard["source_queue_sha"] == expected_source_sha

              input_ids = [entry["event_id"] for entry in shard["entries"]]
              decision_ids = [decision["event_id"] for decision in payload["decisions"]]
              assert len(set(input_ids)) == len(input_ids)
              assert len(set(decision_ids)) == len(decision_ids)
              assert set(input_ids) == set(decision_ids)

              overlap = all_input_ids.intersection(input_ids)
              assert not overlap, f"duplicate event ids across shards: {sorted(overlap)[:5]}"
              all_input_ids.update(input_ids)
              all_decision_ids.update(decision_ids)
              total_entries += len(input_ids)
              total_decisions += len(decision_ids)
              for decision in payload["decisions"]:
                  counts[decision["decision"]] += 1

          assert queue_blob_sha == expected_source_sha, (queue_blob_sha, expected_source_sha)
          assert total_entries == total_decisions == 1128
          assert all_input_ids == all_decision_ids
          print("Validated backlog audit:", total_entries, counts)
          PY

      - name: Apply all eight shards
        shell: bash
        run: |
          set -euo pipefail
          for shard_id in 01 02 03 04 05 06 07 08; do
            tmp="/tmp/jd-decisions-${shard_id}.json"
            cp "market/job-description/01-data/automation/backlog-audit/decisions-${shard_id}.json" "${tmp}"
            python market/job-description/04-scripts/jd.py apply-audit \
              --queue-file market/job-description/01-data/automation/review-queue.json \
              --decisions-file "${tmp}" \
              --official-file market/job-description/01-data/official-jds.json \
              --bytedance-file market/job-description/01-data/bytedance-jds.json \
              --index-file market/job-description/01-data/岗位JD.md
          done

      - name: Regenerate incremental audit batch
        shell: bash
        run: |
          python market/job-description/04-scripts/jd.py prepare-audit \
            --queue-file market/job-description/01-data/automation/review-queue.json \
            --batch-file market/job-description/01-data/automation/audit-batch.json \
            --limit 24

      - name: Refresh stored snapshot manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          business = Path("market/job-description")
          manifest_path = business / "03-strategy/stored-snapshots.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          changed = {
              "01-data/official-jds.json",
              "01-data/bytedance-jds.json",
              "01-data/岗位JD.md",
          }
          seen = set()
          for entry in manifest["files"]:
              if entry["path"] not in changed:
                  continue
              raw = (business / entry["path"]).read_bytes()
              entry["bytes"] = len(raw)
              entry["sha256"] = hashlib.sha256(raw).hexdigest()
              seen.add(entry["path"])
          assert seen == changed, (seen, changed)
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify JD subsystem
        shell: bash
        run: |
          python market/job-description/04-scripts/jd.py check
          python - <<'PY'
          import json
          from pathlib import Path
          queue = json.loads(Path("market/job-description/01-data/automation/review-queue.json").read_text())
          entries = list(queue.get("entries", {}).values())
          counts = {}
          for entry in entries:
              state = entry.get("review_state")
              counts[state] = counts.get(state, 0) + 1
          pending = counts.get("pending", 0)
          print("queue states:", counts)
          if pending:
              raise SystemExit(f"historical backlog not fully consumed: pending={pending}")
          PY

      - name: Commit applied backlog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            market/job-description/01-data/automation/review-queue.json \
            market/job-description/01-data/automation/audit-batch.json \
            market/job-description/01-data/official-jds.json \
            market/job-description/01-data/bytedance-jds.json \
            market/job-description/01-data/岗位JD.md \
            market/job-description/03-strategy/stored-snapshots.json
          if git diff --cached --quiet; then
            echo "No backlog changes to commit."
            exit 0
          fi
          git commit -m "market: apply historical JD backlog audit [bulk-audit-applied]"
          git push origin HEAD:automation/jd-backlog-bulk-audit-20261014
