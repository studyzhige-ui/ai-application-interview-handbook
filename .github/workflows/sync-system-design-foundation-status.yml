name: Sync System Design and Foundation status

on:
  push:
    branches:
      - canonicalize-questions
    paths:
      - tools/sync_system_design_foundation_status.py
      - .github/workflows/sync-system-design-foundation-status.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonicalize-questions
          fetch-depth: 0
      - name: Synchronize status and audit files
        run: python tools/sync_system_design_foundation_status.py
      - name: Commit synchronized status
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md fastapi backend-engineering python system-design roadmap research
          git commit -m "docs: sync System Design completion and Foundation status"
          git push origin HEAD:canonicalize-questions
