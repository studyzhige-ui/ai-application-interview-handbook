name: Self-hosted runner smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-hosted-runner-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: Report runner environment
        shell: powershell
        run: |
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "USER=$env:USERNAME"
          git --version
          python --version
          node --version
