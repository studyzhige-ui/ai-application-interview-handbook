name: Discover official 2027 recruitment portals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_dynamic_official_jobs.mjs'
      - 'market/jobs/official-2027-campus-sources.json'
      - '.github/workflows/discover-official-2027-portals.yml'

permissions:
  contents: write

concurrency:
  group: official-2027-portal-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Discover from official roots
        run: node tools/fetch_dynamic_official_jobs.mjs market/jobs/official-2027-browser-discovery.generated.json

      - name: Commit discovery diagnostics safely
        run: |
          cp market/jobs/official-2027-browser-discovery.generated.json /tmp/official-2027-browser-discovery.generated.json
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          cp /tmp/official-2027-browser-discovery.generated.json market/jobs/official-2027-browser-discovery.generated.json
          if [ -z "$(git status --porcelain -- market/jobs/official-2027-browser-discovery.generated.json)" ]; then
            echo "No portal discovery changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/jobs/official-2027-browser-discovery.generated.json
          git commit -m 'market: discover official 2027 recruitment portals'
          git push origin HEAD:${{ github.ref_name }}
