name: Inspect registered official JD sources (collection disabled)

# Manual inspection only. Live browser discovery is available through the
# bounded local CLI documented in market/job-description/04-scripts/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sources:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Windows"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.event.repository.private == false
        with:
          python-version: '3.12'
      - name: Check existing Windows Python
        if: github.event.repository.private == true
        shell: powershell
        run: |
          python -c "import sys; assert sys.version_info >= (3, 12)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: List stored registered source IDs without network collection
        run: python -B market/job-description/04-scripts/jd.py sources
