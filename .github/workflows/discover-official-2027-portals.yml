name: Debug official 2027 recruitment portals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
          node --check tools/fetch_dynamic_official_jobs.mjs

      - name: Exhaust fixed official job-list pages
        run: node tools/fetch_dynamic_official_jobs.mjs /tmp/official-2027-browser-debug.json

      - uses: actions/upload-artifact@v4
        with:
          name: official-2027-browser-debug
          path: /tmp/official-2027-browser-debug.json
          retention-days: 2
