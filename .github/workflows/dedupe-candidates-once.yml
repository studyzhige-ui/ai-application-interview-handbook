name: dedupe-candidates-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-candidates-once.yml'

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedupe-379-audit
          fetch-depth: 1
      - name: Build candidate report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, difflib, itertools
          d=json.loads(Path('research/dedupe-audit.json').read_text(encoding='utf-8'))
          byid={e['id']:e for e in d['entries']}
          exact_pairs=set()
          exact_later=set()
          for g in d['exact_url_groups']:
              ids=sorted(set(g['ids']))
              for a,b in itertools.combinations(ids,2): exact_pairs.add((a,b))
              exact_later.update(ids[1:])
          cand={}
          def add(a,b,reason,score=0):
              if a>b:a,b=b,a
              if (a,b) in exact_pairs:return
              k=(a,b); x=cand.setdefault(k,{'a':a,'b':b,'reasons':set(),'score':0})
              x['reasons'].add(reason); x['score']=max(x['score'],score)
          for p in d['similar_pairs']:
              if p['score']>=0.34:add(p['a'],p['b'],f"qsim={p['score']:.3f}/jac={p['jac']:.3f}/seq={p['seq']:.3f}",p['score'])
          for g in d['same_author_company']:
              ids=g['ids']
              for a,b in itertools.combinations(ids,2):add(a,b,f"same-author={g['author']}",0.60)
          ids=sorted(byid)
          for a,b in itertools.combinations(ids,2):
              ea,eb=byid[a],byid[b]
              if ea['company_norm']!=eb['company_norm']:continue
              ta=re.sub(r'\s+','',ea['title'].lower()); tb=re.sub(r'\s+','',eb['title'].lower())
              tr=difflib.SequenceMatcher(None,ta,tb,autojunk=False).ratio()
              # date-ish tokens + near-identical headings are strong even if questions were summarized differently
              da=set(re.findall(r'(?:2026[-/.年]\d{1,2}(?:[-/.月]\d{1,2})?|\b\d{1,2}[/-]\d{1,2}\b)',ea['title']))
              db=set(re.findall(r'(?:2026[-/.年]\d{1,2}(?:[-/.月]\d{1,2})?|\b\d{1,2}[/-]\d{1,2}\b)',eb['title']))
              if tr>=0.78 and (da&db or tr>=0.90):add(a,b,f"title-sim={tr:.3f};date-overlap={sorted(da&db)}",tr)
          rows=sorted(cand.values(),key=lambda x:(-x['score'],x['a'],x['b']))
          lines=['# Non-exact-URL dedupe candidates','',f"Exact-URL later IDs already removable: {len(exact_later)}",f"Non-exact candidate pairs: {len(rows)}",'']
          for r in rows[:250]:
              a,b=r['a'],r['b']; ea,eb=byid[a],byid[b]
              lines += [f"## S{a:03d} ↔ S{b:03d}",f"- reasons: {'; '.join(sorted(r['reasons']))}",f"- A: {ea['title']}",f"- B: {eb['title']}",f"- authors: {ea.get('author','')!r} / {eb.get('author','')!r}",f"- A urls: {ea.get('source_urls',[])}",f"- B urls: {eb.get('source_urls',[])}",'- A questions:']
              qa=ea.get('qtext','').splitlines()[:10]; qb=eb.get('qtext','').splitlines()[:10]
              lines += [f"  {q}" for q in qa] or ['  (none)']
              lines += ['- B questions:']+[f"  {q}" for q in qb] if qb else ['- B questions:','  (none)']
              lines += ['']
          Path('research/dedupe-candidates.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines[:260]))
          PY
      - name: Commit candidate report to temporary branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dedupe-candidates.md
          git commit -m 'chore: generate non-url dedupe candidates' || exit 0
          git push origin HEAD:dedupe-379-audit
