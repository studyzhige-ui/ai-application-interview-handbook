name: Agent publication verification
on:
  push:
    branches: ['maintenance/agent-style-restoration-20260917']
    paths: ['tools/_agent_publish*.py', '.github/workflows/agent-publication-preview.yml']
permissions:
  contents: write
concurrency:
  group: agent-publication-preview
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Build and test source-preserving curriculum
        run: |
          git config core.quotePath false
          python -B tools/_agent_publish_apply.py
          python -B tools/_agent_publish_polish.py
          cp tools/_agent_publish_validate.py tools/validate_agent_readability.py
          python -B tools/validate_agent_readability.py --run-examples
      - name: Export reviewed candidate without credentials
        run: |
          mkdir -p /tmp/agent-publication
          cp -r agent roadmap research tools README.md /tmp/agent-publication/
          find /tmp/agent-publication -name '__pycache__' -type d -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v4
        with:
          name: agent-publication-candidate
          path: /tmp/agent-publication/
          retention-days: 1
      - name: Commit to maintenance branch only; main requires final read-back
        env:
          TARGET: maintenance/agent-style-restoration-20260917
        run: |
          test "$GITHUB_REF_NAME" = "$TARGET"
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          for p in Path('agent').rglob('*.md'):
              p.write_text('\n'.join(line.rstrip() for line in p.read_text().splitlines()).rstrip()+'\n')
          PY
          rm -rf tools/_agent_restore tools/_agent_main_bundle
          rm -f tools/_agent_publish*.py tools/_agent_publication_result.json
          rm -f .github/workflows/agent-main-review-temp.yml .github/workflows/agent-publication-preview.yml
          python -B tools/validate_agent_readability.py --run-examples
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(agent): publish rich 24-chapter curriculum with retained failure mechanisms and original teaching style'
          git push origin HEAD:"$TARGET"
