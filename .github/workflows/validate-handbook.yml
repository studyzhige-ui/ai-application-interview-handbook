name: Validate handbook

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.py'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.ipynb'
      - '.github/workflows/*.yml'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.py'
      - '**/*.mjs'
      - '**/*.json'
      - '**/*.ipynb'
      - '.github/workflows/*.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python on public runner
        if: github.event.repository.private == false
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node on public runner
        if: github.event.repository.private == false
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check toolchain
        shell: python
        run: |
          import subprocess, sys
          assert sys.version_info >= (3, 12), sys.version
          subprocess.run(['node', '-e', 'if(Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'], check=True)
      - name: Test repository navigation checks
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Validate structure, README coverage and local links
        run: python tools/check_handbook.py
      - name: Validate official job data and collection contracts offline
        run: python market/job-description/04-scripts/jd.py check
      - name: Verify coding examples and notebook synchronization
        run: python practice/coding/exercises/validate_coding_curriculum.py
      - name: Test coding notebook rendering
        run: python -m unittest discover -s practice/coding/exercises -p "test_*.py" -v
      - name: Test interview source extraction and classification regressions
        run: python -m unittest discover -s market/interview-experience/04-scripts -p "test_*.py" -v
      - name: Verify interview derivatives and preparation evidence are reproducible
        run: python market/interview-experience/04-scripts/build_interview_analysis.py --check
