name: Validate handbook

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'tools/**/*.py'
      - 'tools/**/*.json'
      - 'guide/*.json'
      - 'curriculum/**/chapter-order.json'
      - 'curriculum/**/chapters.json'
      - 'tools/**/*.mjs'
      - 'market/jobs/official-2027-campus-sources.json'
      - '.github/workflows/*.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'tools/**/*.py'
      - 'tools/**/*.json'
      - 'guide/*.json'
      - 'curriculum/**/chapter-order.json'
      - 'curriculum/**/chapters.json'
      - 'tools/**/*.mjs'
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: validate-handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: Validate (private / Windows self-hosted)
    if: github.event.repository.private == true
    runs-on: [self-hosted, Windows]
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local Windows toolchain
        shell: powershell
        run: |
          python -c "import sys; print(sys.version); assert sys.version_info >= (3, 12)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const major=Number(process.versions.node.split('.')[0]); console.log(process.version); if(major < 22) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Install lightweight handbook validation dependencies
        run: python -m pip install -r tools/agent-validation-requirements.txt

      - name: Test handbook examples and navigation contracts
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Test offline course mechanisms
        run: python tools/run_course_regressions.py

      - name: Check generated navigation and all local links
        run: python tools/sync_outer_navigation.py --check

      - name: Check Coding examples and Notebook synchronization
        run: python tools/validate_coding_curriculum.py

      - name: Check Backend chapter sequence
        run: python curriculum/05-backend-engineering/examples/check_navigation.py

      - name: Test official job search security handling
        run: node --test tools/test_official_job_search.mjs

      - name: Check dynamic job fetcher
        run: node --check tools/fetch_dynamic_official_jobs.mjs

      - name: Check Xiaomi fetcher
        run: node --check tools/fetch_xiaomi_2027.mjs

      - name: Check ByteDance fetcher
        run: node --check tools/fetch_bytedance_2027.mjs

      - name: Check Feishu fetcher
        run: node --check tools/fetch_feishu_official_2027.mjs

      - name: Check Moka fetcher
        run: node --check tools/fetch_moka_official_2027.mjs

      - name: Validate official job source contracts
        run: python tools/validate_official_2027_source_contracts.py

      - name: Validate handbook structure and local links
        run: python tools/validate_agent_readability.py

      - name: Validate repository semantics
        run: python tools/validate_repository_semantics.py

      - name: Apply canonical audit
        run: python tools/apply_canonical_audit.py

      - name: Verify canonical audit is reproducible
        run: git diff --exit-code -- interview/canonical

      - name: Build raw gap candidates
        run: python tools/build_gap_candidates.py

      - name: Build frozen Canonical analysis
        run: python tools/build_market_analysis.py

      - name: Validate reviewed source coverage
        run: python tools/validate_source_coverage.py

      - name: Verify generated market analysis is reproducible
        run: git diff --exit-code -- market/analysis

  validate-linux:
    name: Validate (public / Linux GitHub-hosted)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Install lightweight handbook validation dependencies
        run: python -m pip install -r tools/agent-validation-requirements.txt

      - name: Test handbook examples and navigation contracts
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Test offline course mechanisms
        run: python tools/run_course_regressions.py

      - name: Check generated navigation and all local links
        run: python tools/sync_outer_navigation.py --check

      - name: Check Coding examples and Notebook synchronization
        run: python tools/validate_coding_curriculum.py

      - name: Check Backend chapter sequence
        run: python curriculum/05-backend-engineering/examples/check_navigation.py

      - name: Test official job search security handling
        run: node --test tools/test_official_job_search.mjs

      - name: Check dynamic job fetcher
        run: node --check tools/fetch_dynamic_official_jobs.mjs

      - name: Check Xiaomi fetcher
        run: node --check tools/fetch_xiaomi_2027.mjs

      - name: Check ByteDance fetcher
        run: node --check tools/fetch_bytedance_2027.mjs

      - name: Check Feishu fetcher
        run: node --check tools/fetch_feishu_official_2027.mjs

      - name: Check Moka fetcher
        run: node --check tools/fetch_moka_official_2027.mjs

      - name: Validate official job source contracts
        run: python tools/validate_official_2027_source_contracts.py

      - name: Validate handbook structure and local links
        run: python tools/validate_agent_readability.py

      - name: Validate repository semantics
        run: python tools/validate_repository_semantics.py

      - name: Apply canonical audit
        run: python tools/apply_canonical_audit.py

      - name: Verify canonical audit is reproducible
        run: git diff --exit-code -- interview/canonical

      - name: Build raw gap candidates
        run: python tools/build_gap_candidates.py

      - name: Build frozen Canonical analysis
        run: python tools/build_market_analysis.py

      - name: Validate reviewed source coverage
        run: python tools/validate_source_coverage.py

      - name: Verify generated market analysis is reproducible
        run: git diff --exit-code -- market/analysis
