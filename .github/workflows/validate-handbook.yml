name: Validate handbook

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'tools/**/*.py'
      - 'tools/**/*.json'
      - 'tools/**/*.mjs'
      - 'market/jobs/official-2027-campus-sources.json'
      - '.github/workflows/*.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'tools/**/*.py'
      - 'tools/**/*.json'
      - '.github/workflows/*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile repository tools
        run: |
          python -m py_compile tools/*.py
          node --check tools/fetch_dynamic_official_jobs.mjs
          node --check tools/fetch_xiaomi_2027.mjs
          node --check tools/fetch_bytedance_2027.mjs

      - name: Validate official 2027 job source contracts
        run: python tools/validate_official_2027_source_contracts.py

      - name: Validate handbook structure and local links
        run: python tools/validate_agent_readability.py

      - name: Validate repository semantics
        run: python tools/validate_repository_semantics.py

      - name: Verify canonical audit is reproducible
        run: |
          python tools/apply_canonical_audit.py
          git diff --exit-code -- interview/canonical

      - name: Verify generated market analysis is reproducible
        run: |
          python tools/build_gap_candidates.py
          python tools/build_market_analysis.py
          python tools/validate_source_coverage.py
          git diff --exit-code -- market/analysis
