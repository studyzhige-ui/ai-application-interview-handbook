name: Final quality remediation

on:
  push:
    branches:
      - canonicalize-questions
    paths:
      - tools/final_quality_remediation.py
      - .github/workflows/final-quality-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonicalize-questions
      - name: Apply cross-module boundary remediation
        run: python tools/final_quality_remediation.py
      - name: Validate links
        run: python tools/final_v1_quality_audit.py
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system-design/docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs(system-design): clarify primary module boundaries"
            git push origin HEAD:canonicalize-questions
          fi
