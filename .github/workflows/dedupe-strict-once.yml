name: dedupe-strict-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-strict-once.yml'

permissions:
  contents: write

jobs:
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedupe-379-audit
          fetch-depth: 1
      - name: Build strict semantic candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,itertools,difflib
          d=json.loads(Path('research/dedupe-audit.json').read_text(encoding='utf-8'))
          byid={e['id']:e for e in d['entries']}
          exact_pairs=set()
          for g in d['exact_url_groups']:
              for a,b in itertools.combinations(sorted(set(g['ids'])),2): exact_pairs.add((a,b))
          qscore={}
          for p in d['similar_pairs']:
              a,b=sorted((p['a'],p['b'])); qscore[(a,b)]=p['score']
          same_author=set()
          for g in d['same_author_company']:
              for a,b in itertools.combinations(sorted(g['ids']),2): same_author.add((a,b))
          def date_tokens(t):
              # Keep exact dates / month-day tokens; publication date equality is a supporting signal only.
              toks=set(re.findall(r'2026[-/.年]\d{1,2}(?:[-/.月]\d{1,2})?|\b\d{1,2}[/-]\d{1,2}\b',t))
              return toks
          def role_core(t):
              x=re.sub(r'2026[^｜]*','',t)
              x=re.sub(r'(一面|二面|三面|四面|leader面|hr面|技术面|终面|发布|面试|约?\d+min|\d+h|\d+分钟)','',x,flags=re.I)
              return re.sub(r'\s+','',x.lower())
          rows=[]
          ids=sorted(byid)
          for a,b in itertools.combinations(ids,2):
              if (a,b) in exact_pairs: continue
              ea,eb=byid[a],byid[b]
              if ea['company_norm']!=eb['company_norm']: continue
              qs=qscore.get((a,b),0)
              tr=difflib.SequenceMatcher(None,role_core(ea['title']),role_core(eb['title']),autojunk=False).ratio()
              dates=date_tokens(ea['title']) & date_tokens(eb['title'])
              reasons=[]
              if qs>=0.50: reasons.append(f'qsim={qs:.3f}')
              if (a,b) in same_author: reasons.append('same-author-company')
              if tr>=0.92 and dates: reasons.append(f'role-title={tr:.3f}+same-date={sorted(dates)}')
              if not reasons: continue
              rows.append((max(qs,tr if dates else 0),a,b,reasons))
          rows.sort(reverse=True)
          out=['# Strict semantic dedupe candidates','',f'Pairs: {len(rows)}','']
          for score,a,b,reasons in rows:
              ea,eb=byid[a],byid[b]
              out += [f'## S{a:03d} ↔ S{b:03d}',f"- reasons: {'; '.join(reasons)}",f"- A: {ea['title']}",f"- B: {eb['title']}",f"- authors: {ea.get('author','')!r} / {eb.get('author','')!r}",f"- A urls: {ea.get('source_urls',[])}",f"- B urls: {eb.get('source_urls',[])}",'- A questions:']
              out += [f'  {q}' for q in ea.get('qtext','').splitlines()[:14]] or ['  (none)']
              out += ['- B questions:']
              out += [f'  {q}' for q in eb.get('qtext','').splitlines()[:14]] or ['  (none)']
              out += ['']
          Path('research/dedupe-strict.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out[:400]))
          PY
      - name: Commit strict report to temporary branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dedupe-strict.md
          git commit -m 'chore: generate strict semantic dedupe report' || exit 0
          git push origin HEAD:dedupe-379-audit
