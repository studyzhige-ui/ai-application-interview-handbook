name: Final audit status sync

on:
  push:
    branches:
      - canonicalize-questions
    paths:
      - tools/final_audit_status_sync.py
      - .github/workflows/final-audit-status-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonicalize-questions
      - name: Synchronize final audit entrypoints
        run: python tools/final_audit_status_sync.py
      - name: Run final mechanical audit
        run: |
          python tools/final_v1_quality_audit.py
          python tools/final_mermaid_audit.py
      - name: Commit synchronized entrypoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md roadmap/knowledge-map.md roadmap/documentation-style-guide.md research/questions/progress.md research/questions/module-index.md research/questions/README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: publish v1 final quality audit status"
            git push origin HEAD:canonicalize-questions
          fi
