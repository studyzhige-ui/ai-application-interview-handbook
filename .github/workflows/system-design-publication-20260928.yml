name: Integrate system-design publication
on:
  push:
    branches: [docs/system-design-reader-first-20260928]
    paths: [.github/workflows/system-design-publication-20260928.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'studyzhige-ui/ai-application-interview-handbook' && github.ref == 'refs/heads/docs/system-design-reader-first-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify draft, integrate navigation and validate complete repository
        shell: python
        run: |
          from __future__ import annotations
          import hashlib, json, os, platform, runpy, subprocess, sys
          from pathlib import Path
          
          BASE = 'a6b51b9f00bf3fe7910cfe4ca248e80545f566e3'
          BRANCH = 'docs/system-design-reader-first-20260928'
          TEMP = '.github/workflows/system-design-publication-20260928.yml'
          AUDIT = 'guide/audits/system-design-reader-first-2026-09-28.md'
          PREFIX = 'curriculum/10-system-design/'
          SHARED = {'guide/learning-order.json', 'guide/navigation-index.json',
                    'guide/navigation-index.md', 'guide/audits/README.md',
                    'guide/audits/content-depth-audit.md'}
          EXPECTED = '592d7d603afb582e4e913b88360f37da7adb227a07f451d970c8835ac30b2425'
          START = os.environ['GITHUB_SHA']
          os.chdir(os.environ['GITHUB_WORKSPACE'])
          OUT = Path(os.environ['RUNNER_TEMP']) / 'system-design-publication'
          OUT.mkdir(parents=True, exist_ok=True)
          results = []
          
          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()
          
          def names(*args: str) -> set[str]:
              raw = subprocess.check_output(['git', *args])
              return {p.decode('utf-8') for p in raw.split(b'\0') if p}
          
          def blobs(ref: str) -> dict[str, str]:
              result = {}
              raw = subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', ref])
              for entry in raw.split(b'\0'):
                  if not entry:
                      continue
                  info, path = entry.split(b'\t', 1)
                  mode, kind, sha = info.decode().split()
                  if kind == 'blob':
                      result[path.decode('utf-8')] = sha
              return result
          
          def run(args: list[str], name: str) -> str:
              print('\nRUN', ' '.join(args), flush=True)
              proc = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (OUT / f'{name}.log').write_bytes(proc.stdout)
              text = proc.stdout.decode('utf-8', errors='replace')
              print(text, flush=True)
              results.append({'name': name, 'command': args, 'returncode': proc.returncode})
              if proc.returncode:
                  raise RuntimeError(f'{name} failed with exit {proc.returncode}')
              return text
          
          run(['git', 'fetch', 'origin', 'main'], 'fetch-main')
          assert git('rev-parse', 'origin/main') == BASE, 'main moved; explicit integration required'
          assert git('rev-parse', 'HEAD') == START
          initial = blobs('HEAD')
          owned = {p for p in initial if p.startswith(PREFIX) or p == AUDIT}
          pairs = [[p, initial[p]] for p in sorted(owned)]
          (OUT / 'original-draft-blobs.json').write_text(json.dumps(pairs, ensure_ascii=False, indent=2), encoding='utf-8')
          actual = hashlib.sha256(json.dumps(pairs, ensure_ascii=False, separators=(',', ':')).encode()).hexdigest()
          print('DRAFT_DIGEST', actual, 'FILES', len(owned), flush=True)
          assert len(owned) == 29 and actual == EXPECTED, 'draft transfer mismatch; inspect original-draft-blobs.json'
          assert names('diff', '--name-only', '-z', BASE, 'HEAD') == owned | {TEMP}, 'unexpected initial scope'
          assert not Path('research').exists(), 'legacy protected layout conflict'
          
          order_path = Path('guide/learning-order.json')
          order = json.loads(order_path.read_text(encoding='utf-8'))
          module = [m for m in order['modules'] if m['directory'] == '10-system-design']
          assert len(module) == 1
          if AUDIT not in module[0].setdefault('review_records', []):
              module[0]['review_records'].append(AUDIT)
          order_path.write_text(json.dumps(order, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          run([sys.executable, 'tools/sync_outer_navigation.py', '--apply', '--report', str(OUT/'navigation-apply.json')], 'navigation-apply')
          assert names('diff', '--name-only', '-z') <= SHARED, 'generator changed another module or protected file'
          run([sys.executable, '-m', 'compileall', '-q', 'tools', PREFIX + 'review'], 'compile-python')
          run([sys.executable, '-m', 'unittest', 'discover', '-s', PREFIX+'review', '-p', 'test_mechanism_lab.py', '-v'], 'mechanism-tests')
          a = run([sys.executable, PREFIX+'review/mechanism_lab.py', 'all'], 'demo-first')
          b = run([sys.executable, PREFIX+'review/mechanism_lab.py', 'all'], 'demo-second')
          assert a == b, 'cold-start demo output changed'
          run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tools', '-p', 'test_outer_navigation.py', '-v'], 'outer-navigation-tests')
          run([sys.executable, '-c', "import runpy; d=runpy.run_path('tools/test_learning_navigation.py'); names=[n for n in d if n.startswith('test_')]; [d[n]() for n in names]; print(f'{len(names)} learning-order regression checks passed')"], 'learning-order-tests')
          for file in ['fetch_dynamic_official_jobs.mjs', 'fetch_xiaomi_2027.mjs', 'fetch_bytedance_2027.mjs', 'fetch_feishu_official_2027.mjs', 'fetch_moka_official_2027.mjs']:
              run(['node', '--check', 'tools/' + file], 'syntax-' + file)
          for file in ['validate_official_2027_source_contracts.py', 'validate_agent_readability.py', 'validate_repository_semantics.py', 'apply_canonical_audit.py']:
              run([sys.executable, 'tools/' + file], file.removesuffix('.py'))
          run(['git', 'diff', '--exit-code', '--', 'interview/canonical'], 'canonical-unchanged')
          for file in ['build_gap_candidates.py', 'build_market_analysis.py', 'validate_source_coverage.py']:
              run([sys.executable, 'tools/' + file], file.removesuffix('.py'))
          run(['git', 'diff', '--exit-code', '--', 'market/analysis'], 'market-analysis-unchanged')
          assert names('diff', '--name-only', '-z') <= SHARED, 'validation modified protected tracked content'
          run([sys.executable, 'tools/sync_outer_navigation.py', '--check', '--report', str(OUT/'navigation-check.json')], 'navigation-check')
          nav = json.loads((OUT/'navigation-check.json').read_text())
          run(['git', 'diff', '--check'], 'whitespace-before-record')
          
          record = Path(AUDIT)
          original = record.read_text(encoding='utf-8')
          marker = '## 1. 交付状态与基线'
          note = '> **记录分层：** 第 1—8 节保留仅文件稿交付时的审查快照；第 9 节记录用户随后授权发布后的完整仓库集成。旧记录中的“未发布、未运行全仓检查”只描述原交付阶段，不覆盖后续验证。\n\n'
          assert marker in original and '## 9. 发布授权后的完整仓库集成' not in original
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          section = f'''\n\n## 9. 发布授权后的完整仓库集成\n\n用户随后明确授权创建 commit、PR 并合并 main。本节记录发布前的实际集成验证，最终合并事实以对应 PR 为准；不回写第 1—8 节的历史检查结果。\n\n集成基线：`{BASE}`。原稿写入候选提交：`{START}`。原始 29 份文件的路径与 Git blob 聚合 SHA-256 为 `{actual}`，与已交付文件稿逐项一致。\n\n在完整仓库的独立 GitHub Actions 工作区执行，运行环境为 Python {platform.python_version()}、{git('--version')}，Node 版本 `{subprocess.check_output(['node','--version'], text=True).strip()}`。实际日志及文件指纹见[本次集成运行]({run_url})的验证产物。\n\n完成：模块机制测试、两次冷启动示例一致性、Python 与五个 JavaScript 工具语法检查、外围导航回归、学习顺序回归、岗位契约、仓库可读性与语义检查、Canonical 和市场分析生成复现、正式来源覆盖及 Git 差异检查。生成器从真实文件计算课程总数 {nav['curriculum_chapters']}；检查 {nav['markdown_pages_scanned']} 份 Markdown、{nav['local_links_checked']} 个本地链接，无缺失目标、未解析锚点或冲突标记，生成漂移为零。详细命令和各自退出结果保存在运行产物中。\n\n共享变更仅限本模块审核入口、章节标题及指纹对应的五个文件；不改变课程章节数、阅读顺序、其他模块正文、冻结证据、来源规则或历史快照。28 份教学与实验文件保持原稿字节不变，本审计仅增加明确的后续集成记录。临时发布工作流在最终 PR 差异中移除，不进入 main。\n\n本阶段未重新进行浏览器显示验收，沿用原稿显示检查的限定范围；未运行真实数据库、消息代理、模型供应商、OAuth、S3、多连接并发、负载或生产实验。完整仓库验证不把顺序内存模型升级为真实服务保证。PR 的常规 CI 在最终文件状态上单独执行。\n'''
          record.write_text(original.replace(marker, note + marker, 1) + section, encoding='utf-8')
          run([sys.executable, 'tools/sync_outer_navigation.py', '--check', '--report', str(OUT/'final-navigation-check.json')], 'final-navigation-check')
          run(['git', 'diff', '--check'], 'final-whitespace')
          changed = names('diff', '--name-only', '-z')
          assert changed <= SHARED | {AUDIT}, repr(changed)
          for p in owned - {AUDIT}:
              data = Path(p).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert sha == initial[p], f'teaching file changed: {p}'
          run(['git', 'config', 'user.name', 'github-actions[bot]'], 'git-name')
          run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], 'git-email')
          run(['git', 'add', '--', *sorted(changed)], 'stage-scoped-integration')
          run(['git', 'diff', '--cached', '--check'], 'staged-whitespace')
          run(['git', 'commit', '-m', 'docs(system-design): integrate generated navigation and record full-repository validation'], 'commit-integration')
          assert names('diff', '--name-only', '-z', BASE, 'HEAD') == owned | SHARED | {TEMP}
          final = blobs('HEAD')
          base_files = blobs(BASE)
          protected_changed = [p for p in base_files if p not in owned | SHARED and final.get(p) != base_files[p]]
          assert not protected_changed, repr(protected_changed)
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == BASE, 'main moved during validation'
          assert git('ls-remote', 'origin', 'refs/heads/' + BRANCH).split()[0] == START, 'publication branch moved'
          summary = {'base': BASE, 'draft_commit': START, 'integration_commit': git('rev-parse','HEAD'),
                     'integration_tree': git('rev-parse','HEAD^{tree}'), 'draft_digest': actual,
                     'python': platform.python_version(), 'navigation': nav, 'checks': results,
                     'protected_content_changes': protected_changed,
                     'final_files': {p: final[p] for p in sorted(owned | SHARED)}}
          (OUT/'integration-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('INTEGRATION_SUMMARY', json.dumps(summary, ensure_ascii=False), flush=True)
          run(['git', 'push', 'origin', 'HEAD:refs/heads/' + BRANCH], 'push-scoped-integration')
      - name: Preserve actual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-design-publication-verification
          path: ${{ runner.temp }}/system-design-publication/
          if-no-files-found: warn
          retention-days: 7
