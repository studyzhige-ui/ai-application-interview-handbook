name: Reject routine no-result collection PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  prevent-log-only-pr:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close and remove redundant daily audit PR when there is no accepted data
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # No checkout of PR contents; only inspect GitHub metadata.
          [[ "$PR_HEAD" != "main" && -n "$PR_HEAD" ]] || exit 0
          [[ "$PR_TITLE" == *"采集审计"* || "$PR_TITLE" == *"正式归档未完成"* ]] || exit 0
          current_pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          [[ "$current_pr" == "$PR_SHA" ]] || exit 0

          mapfile -t files < <(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          [[ "${#files[@]}" -eq 1 ]] || exit 0
          if [[ ! "${files[0]}" =~ ^market/interview-experience/05-logs/collection-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]]; then
            exit 0
          fi

          gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            -f body="自动化发布规范：仅有未完成的每日采集审计日志、没有合格的新面经或正式数据变化时，不应创建分支或 PR。请把运行情况保存在任务日志，下一轮直接基于 main 采集。若存在真正的代码修复，请单独提交明确的代码变更。"
          gh api --method PATCH "repos/$GH_REPO/pulls/$PR_NUMBER" -f state=closed >/dev/null

          # Remove only the exact untouched branch that generated this PR.
          now=$(gh api "repos/$GH_REPO/git/ref/heads/$PR_HEAD" --jq '.object.sha') || exit 0
          if [[ "$now" == "$PR_SHA" ]]; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$PR_HEAD"
          fi
