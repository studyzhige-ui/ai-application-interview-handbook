services:
  mysql:
    image: mysql:9.7.3
    container_name: mysql-reader-lab
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a local lab administrator password}
      MYSQL_DATABASE: handbook_mysql_lab
      MYSQL_USER: course
      MYSQL_PASSWORD: ${MYSQL_COURSE_PASSWORD:?Set a separate local lab user password}
    volumes:
      - mysql_course_data:/var/lib/mysql
volumes:
  mysql_course_data:
